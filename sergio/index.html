<p class="cls">Clase · Mago de poder oculto</p>
<p class="msg">Sobre la mesa del Mago esperan todas sus herramientas; solo falta que él se atreva a tomarlas. Eres ese personaje de anime que guarda un poder que todos vemos menos él. Las cartas quieren que sepas algo: tu lugar en este equipo no se gana, ya es tuyo. Aunque a veces no llegues, siempre te esperamos con un brindis. Se acerca el reto que despertará tu poder; cuando llegue, mírate como te vemos nosotros.</p>
<p class="pow"><span>Tu superpoder</span>Hacer magia con lo que tiene a mano.</p>
<p class="reto">Ningún reto nos asusta: en cada oportunidad, pedimos más</p>
